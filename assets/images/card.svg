<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="36" y="86" width="440" height="340" rx="28" fill="url(#cardGrad)" filter="url(#shadow)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Magnetic Stripe / Decorative Wave -->
  <path d="M36 170 Q146 140 256 170 T476 170" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" fill="none"/>
  <path d="M36 186 Q146 156 256 186 T476 186" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" fill="none"/>

  <!-- EMV Chip -->
  <rect x="80" y="160" width="68" height="52" rx="10" fill="url(#chipGrad)" stroke="#a16207" stroke-width="1.5"/>
  <line x1="80" y1="186" x2="148" y2="186" stroke="#a16207" stroke-width="1.5"/>
  <line x1="114" y1="160" x2="114" y2="212" stroke="#a16207" stroke-width="1.5"/>
  <rect x="98" y="174" width="32" height="24" rx="4" fill="none" stroke="#a16207" stroke-width="1.5"/>

  <!-- Contactless waves -->
  <path d="M174 172 A18 18 0 0 1 174 200" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M184 164 A30 30 0 0 1 184 208" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M194 156 A42 42 0 0 1 194 216" stroke="rgba(255,255,255,0.85)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Bank / Card brand symbol -->
  <circle cx="390" cy="176" r="26" fill="#ef4444" opacity="0.9"/>
  <circle cx="426" cy="176" r="26" fill="#f59e0b" opacity="0.9"/>

  <!-- 16-Digit Monospace Dots / Number Preview -->
  <g fill="#ffffff" opacity="0.95">
    <text x="80" y="276" font-family="monospace" font-size="30" font-weight="bold" letter-spacing="4">••••  ••••  ••••  ••••</text>
  </g>

  <!-- Cardholder / Bank Label -->
  <text x="80" y="340" font-family="sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="2">CARD TO CARD</text>
  <text x="80" y="372" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">PAYMENTIO SHETAB</text>

  <!-- Shetab Symbol Badge -->
  <rect x="350" y="338" width="96" height="44" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <text x="398" y="365" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">SHETAB</text>
</svg>